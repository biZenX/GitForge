[versions]
agp = "8.13.2"
kotlin = "2.2.20"
ksp = "2.3.9"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
lifecycleViewmodelCompose = "2.9.2"
activityCompose = "1.13.0"
composeBom = "2026.03.01"
composeMaterial3 = "1.5.0-alpha17"
composeMaterial3WindowSize = "1.5.0-alpha14"
composeMaterialIconsExtended = "1.7.8"
navigationCompose = "2.7.7"
kotlinxSerializationJson = "1.7.3"
kotlinxCoroutines = "1.10.2"
room = "2.7.2"
dagger = "2.58"
hilt = "1.2.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
jgit = "6.10.0.202406032230-r"
